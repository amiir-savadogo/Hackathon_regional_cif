# Configuration de la base de données PostgreSQL (locale ou cloud via variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cif_microcredit}
spring.datasource.username=${DB_USER:cif_user}
spring.datasource.password=${DB_PASSWORD:cif_password}

# Port dynamique (indispensable pour Render.com)
server.port=${PORT:8080}

# JPA / Hibernate : Pour créer les tables automatiquement
# NB : "update" est pratique pour un prototype (pas de migration à gérer),
# mais n'est pas recommandé en production - un vrai déploiement devrait
# passer par des migrations versionnées (Flyway/Liquibase) et "validate" ici.
# Non changé pour le hackathon : passer à "validate" sans migrations en place
# casserait le déploiement (aucune table ne serait créée).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Logs SQL désactivés : l'application manipule des données financières, les
# requêtes (avec valeurs) n'ont pas leur place dans les logs de production.
spring.jpa.show-sql=false

# Nom de notre application
spring.application.name=API Scoring Microcredit
