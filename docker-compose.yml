# Lance les 4 briques du projet ensemble : base de données, moteur IA, backend
# et frontend. Usage : `docker compose up --build` depuis la racine du dépôt,
# puis http://localhost:4200 (frontend), http://localhost:8080/api (backend),
# http://localhost:8000/docs (documentation FastAPI auto-générée).
services:
  # 1. Base de données PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: cif_postgres_db
    environment:
      POSTGRES_USER: cif_user
      POSTGRES_PASSWORD: cif_password
      POSTGRES_DB: cif_microcredit
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cif_user -d cif_microcredit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 2. Moteur de scoring IA (FastAPI + scikit-learn + SHAP)
  ai-service:
    build:
      context: ./ai-service
    container_name: cif_ai_service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 3. Backend Spring Boot (règles métier, validation, persistance)
  backend:
    build:
      context: ./backend
    container_name: cif_backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/cif_microcredit
      DB_USER: cif_user
      DB_PASSWORD: cif_password
      AI_SERVICE_URL: http://ai-service:8000/api/score
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  # 4. Frontend Angular (ng serve avec live reload)
  frontend:
    build:
      context: ./frontend
    container_name: cif_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
